[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vanta-code"
version = "1.0.0"
description = "The autonomous CLI coding agent with a soul."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Vanta Code Team"}]
keywords = ["cli", "agent", "ai", "coding", "terminal", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "textual>=0.61.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "groq>=0.9.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "networkx>=3.3",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "pygments>=2.18.0",
    "gitpython>=3.1.43",
    "plotext>=5.2.8",
    "tree-sitter>=0.23.0",
    "watchdog>=4.0.0",
    "anyio>=4.4.0",
    "patch>=1.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[project.scripts]
vanta = "vanta.cli.app:main"

[tool.hatch.version]
path = "vanta/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["vanta"]

[tool.hatch.build.targets.sdist]
include = [
    "/vanta",
    "/tests",
    "/prompts",
    "/README.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
